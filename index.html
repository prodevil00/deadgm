<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1a140e" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="LAST CONVOY — lead your squad down a zombie-infested desert highway. A free 3D mobile browser game." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Last Convoy" />
    <meta name="format-detection" content="telephone=no" />
    <title>Last Convoy</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <!--APP_CSS-->
  </head>
  <body>
    <div id="stage">
      <canvas id="game" aria-label="Game view"></canvas>
      <div id="float"></div>
      <div id="ui"></div>
      <div id="loading">
        <div class="logo"><div class="l1 gold">LAST CONVOY</div><div class="l2">MOBILE APOCALYPSE</div></div>
        <div class="loadbar"><div id="loadfill"></div></div>
        <div class="loadtxt" id="loadtxt">LOADING</div>
      </div>
    </div>
    <div id="rotate">
      <svg viewBox="0 0 24 24"><path d="M16 1H8C6.3 1 5 2.3 5 4v16c0 1.7 1.3 3 3 3h8c1.7 0 3-1.3 3-3V4c0-1.7-1.3-3-3-3zm1 19c0 .6-.4 1-1 1H8c-.6 0-1-.4-1-1V4c0-.6.4-1 1-1h8c.6 0 1 .4 1 1v16zm-5-1.5a1.2 1.2 0 1 0 0-2.4 1.2 1.2 0 0 0 0 2.4z"/></svg>
      <div class="gold" style="font-size:30px">ROTATE YOUR PHONE</div>
      <div class="muted" style="font-weight:700;font-size:18px">Last Convoy is played in portrait mode.</div>
    </div>
    <svg width="0" height="0" style="position:absolute"><defs><linearGradient id="goldgrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3b8"/><stop offset="0.5" stop-color="#ffd25a"/><stop offset="1" stop-color="#f0a020"/></linearGradient></defs></svg>
    <noscript>Last Convoy needs JavaScript and WebGL.</noscript>
    <!--APP_JS-->
  </body>
</html>
